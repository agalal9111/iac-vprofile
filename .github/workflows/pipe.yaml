name: my infra pipeline

env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
    AWS_REGION: us-east-1
    EKS_CLUSTER: gitops-eks

on:
    push:
        branches:
            - main
            - stage
        paths:
          - terraform/**    
    pull_request:
        branches:
            - manin
        paths:
          - terraform/**      
jobs:
    terraform:
        name: terraform plan and validate
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
                working-directory: ./terraform

        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: prepare and install terraform
              uses: hashicorp/setup-terraform@v3              

            - name: fmt the code
              run: terraform fmt

            - name: initialize terraform
              id: init
              run: terraform init --backend-config="bucket=gitopstf"          

            - name: validate the code
              id: validate
              run: terraform validate

            - name: terraform plan
              id: plan
              run: terraform plan -no-color -input=false -out planfile

            - name: terraform plan status
              if: steps.plan.outcome == 'faliure'
              run: exit 1 

            - name: Run apply Step Only on Main branch
              id: Apply
              if: github.ref == 'refs/heads/main'
              run: terraform apply -auto-approve -input=false  -parallelism=1 planfile
              
            - name: configure AWS cred
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
                aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
                aws-region: ${{env.AWS_REGION}}

            - name: Get Kube CONFIG File
              id: KubeConfig
              if: steps.Apply.outcome == 'success'
              run: aws eks update-kubeconfig --region ${{env.AWS_REGION}} --name ${{ env.EKS_CLUSTER }}

            - name: Install Ingress controller
              if: steps.Apply.outcome == 'success' && steps.KubeConfig.outcome == 'success'
              run: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.1.3/deploy/static/provider/aws/deploy.yaml
       



